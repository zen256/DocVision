<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DocVision</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #0e0e0e;
    --surface:  #161616;
    --border:   #2a2a2a;
    --border-hi:#444;
    --accent:   #e8e8e8;
    --dim:      #666;
    --green:    #4ade80;
    --red:      #f87171;
    --amber:    #fbbf24;
    --mono:     'IBM Plex Mono', monospace;
    --sans:     'IBM Plex Sans', sans-serif;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--accent);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
  }

  /* ── layout ── */
  .shell {
    min-height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr;
  }

  header {
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  header .logo {
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: .06em;
    color: #fff;
  }
  header .logo span { color: var(--dim); font-weight: 400; }
  header .ver {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--dim);
    border: 1px solid var(--border);
    padding: 1px 6px;
    border-radius: 2px;
  }

  main {
    display: grid;
    grid-template-columns: 360px 1fr;
    min-height: 0;
  }

  /* ── left panel ── */
  .panel-left {
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 24px;
    gap: 20px;
    overflow-y: auto;
  }

  .section-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .12em;
    color: var(--dim);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  /* drop zone */
  .drop-zone {
    border: 1px dashed var(--border-hi);
    border-radius: 4px;
    padding: 32px 16px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s, background .15s;
    position: relative;
  }
  .drop-zone:hover, .drop-zone.drag-over {
    border-color: var(--accent);
    background: rgba(255,255,255,.03);
  }
  .drop-zone input[type=file] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
  }
  .drop-icon {
    font-size: 28px;
    margin-bottom: 10px;
    opacity: .5;
  }
  .drop-main {
    font-size: 13px;
    color: var(--accent);
    margin-bottom: 4px;
  }
  .drop-sub {
    font-size: 11px;
    color: var(--dim);
    font-family: var(--mono);
  }
  .drop-zone.has-file .drop-icon { opacity: 1; }
  .drop-zone.has-file { border-color: var(--green); border-style: solid; }
  .file-name {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--green);
    margin-top: 6px;
    word-break: break-all;
  }

  /* inputs */
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--dim);
    letter-spacing: .04em;
  }
  .field input[type=text], .field input[type=number] {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 7px 10px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--accent);
    width: 100%;
    outline: none;
    transition: border-color .15s;
  }
  .field input:focus { border-color: var(--border-hi); }

  .conf-row { display: flex; align-items: center; gap: 10px; }
  input[type=range] {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 2px;
    background: var(--border-hi);
    border-radius: 2px;
    outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
  }
  .conf-val {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--accent);
    min-width: 30px;
    text-align: right;
  }

  /* buttons */
  .btn {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: .04em;
    border: 1px solid var(--border-hi);
    border-radius: 3px;
    padding: 9px 16px;
    cursor: pointer;
    transition: background .15s, border-color .15s, color .15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
  }
  .btn-primary {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
  }
  .btn-primary:hover:not(:disabled) { background: #ccc; border-color: #ccc; }
  .btn-primary:disabled { opacity: .35; cursor: not-allowed; }
  .btn-secondary {
    background: transparent;
    color: var(--dim);
  }
  .btn-secondary:hover { color: var(--accent); border-color: var(--border-hi); }

  .btn-row { display: flex; flex-direction: column; gap: 8px; }

  /* status */
  .status-bar {
    font-family: var(--mono);
    font-size: 11px;
    padding: 8px 10px;
    border-radius: 3px;
    border: 1px solid transparent;
    display: none;
  }
  .status-bar.show { display: block; }
  .status-bar.info  { border-color: var(--border); color: var(--dim); }
  .status-bar.ok    { border-color: #166534; background: #052e16; color: var(--green); }
  .status-bar.err   { border-color: #7f1d1d; background: #2d0a0a; color: var(--red); }
  .status-bar.wait  { border-color: #78350f; background: #1c0e00; color: var(--amber); }

  /* spinner */
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner {
    width: 12px; height: 12px;
    border: 2px solid transparent;
    border-top-color: var(--amber);
    border-radius: 50%;
    animation: spin .7s linear infinite;
    display: inline-block;
    vertical-align: middle;
    margin-right: 6px;
  }

  /* ── right panel ── */
  .panel-right {
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .output-header {
    border-bottom: 1px solid var(--border);
    padding: 10px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .output-tabs {
    display: flex;
    gap: 2px;
  }
  .tab {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--dim);
    padding: 4px 12px;
    border-radius: 2px;
    cursor: pointer;
    letter-spacing: .04em;
    transition: color .12s, background .12s;
    border: none;
    background: transparent;
  }
  .tab:hover { color: var(--accent); }
  .tab.active { background: var(--border); color: var(--accent); }

  .copy-btn {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--dim);
    background: none;
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 3px 10px;
    cursor: pointer;
    transition: color .12s, border-color .12s;
  }
  .copy-btn:hover { color: var(--accent); border-color: var(--border-hi); }

  .output-body {
    flex: 1;
    overflow: auto;
    padding: 20px;
    min-height: 0;
  }

  /* empty state */
  .empty-state {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    color: var(--dim);
  }
  .empty-state .big { font-size: 36px; opacity: .2; }
  .empty-state p { font-family: var(--mono); font-size: 12px; }

  /* ── rendered result view ── */
  #view-rendered { display: none; }
  #view-json     { display: none; }

  .result-title {
    font-family: var(--mono);
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    margin-bottom: 18px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }

  .meta-grid {
    display: grid;
    grid-template-columns: max-content 1fr;
    gap: 4px 16px;
    margin-bottom: 24px;
  }
  .meta-key {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--dim);
    padding: 3px 0;
    white-space: nowrap;
  }
  .meta-val {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--accent);
    padding: 3px 0;
    word-break: break-word;
  }

  .tbl-wrap {
    overflow-x: auto;
    margin-bottom: 24px;
  }
  table {
    border-collapse: collapse;
    width: 100%;
    font-family: var(--mono);
    font-size: 12px;
  }
  th {
    background: var(--surface);
    color: var(--dim);
    font-weight: 500;
    letter-spacing: .04em;
    padding: 7px 12px;
    text-align: left;
    border: 1px solid var(--border);
    white-space: nowrap;
  }
  td {
    padding: 6px 12px;
    border: 1px solid var(--border);
    color: var(--accent);
    vertical-align: top;
  }
  tr:hover td { background: rgba(255,255,255,.02); }

  /* json view */
  #view-json pre {
    font-family: var(--mono);
    font-size: 12px;
    color: #aaa;
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.6;
  }

  /* scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border-hi); border-radius: 3px; }

  @media (max-width: 800px) {
    main { grid-template-columns: 1fr; }
    .panel-left { border-right: none; border-bottom: 1px solid var(--border); }
  }
</style>
</head>
<body>
<div class="shell">

  <header>
    <span class="logo">Doc<span>Vision</span></span>
    <span class="ver">v1.0</span>
  </header>

  <main>
    <!-- LEFT: controls -->
    <aside class="panel-left">

      <div>
        <div class="section-label">Файл</div>
        <div class="drop-zone" id="dropZone">
          <input type="file" id="fileInput" accept="image/*,.jpg,.jpeg,.png,.tif,.tiff,.bmp">
          <div class="drop-icon">📄</div>
          <div class="drop-main">Перетащите изображение</div>
          <div class="drop-sub">или нажмите для выбора</div>
          <div class="file-name" id="fileName" style="display:none"></div>
        </div>
      </div>

      <div class="field">
        <label>ПУТЬ К МОДЕЛИ (best.pt)</label>
        <input type="text" id="modelPath"
               value="./dataset/runs/detect/train-4/weights/best.pt"
               placeholder="./path/to/best.pt">
      </div>

      <div class="field">
        <label>ПОРОГ УВЕРЕННОСТИ YOLO</label>
        <div class="conf-row">
          <input type="range" id="confRange" min="0.05" max="0.95" step="0.05" value="0.30">
          <span class="conf-val" id="confVal">0.30</span>
        </div>
      </div>

      <div class="btn-row">
        <button class="btn btn-primary" id="runBtn" disabled>
          ▶ Распознать
        </button>
        <button class="btn btn-secondary" id="clearBtn">
          ✕ Очистить
        </button>
      </div>

      <div class="status-bar info" id="statusBar">Ожидание файла...</div>

    </aside>

    <!-- RIGHT: output -->
    <section class="panel-right">

      <div class="output-header">
        <div class="output-tabs">
          <button class="tab active" data-tab="rendered">Результат</button>
          <button class="tab" data-tab="json">JSON</button>
        </div>
        <button class="copy-btn" id="copyBtn" style="display:none">Копировать</button>
      </div>

      <div class="output-body" id="outputBody">
        <div class="empty-state" id="emptyState">
          <div class="big">⬡</div>
          <p>Загрузите изображение и нажмите «Распознать»</p>
        </div>

        <div id="view-rendered"></div>
        <div id="view-json"><pre id="jsonPre"></pre></div>
      </div>

    </section>
  </main>
</div>

<script>
  // ── state ──
  let currentFile = null;
  let currentResult = null;
  let activeTab = 'rendered';

  // ── elements ──
  const dropZone  = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  const fileName  = document.getElementById('fileName');
  const modelPath = document.getElementById('modelPath');
  const confRange = document.getElementById('confRange');
  const confVal   = document.getElementById('confVal');
  const runBtn    = document.getElementById('runBtn');
  const clearBtn  = document.getElementById('clearBtn');
  const statusBar = document.getElementById('statusBar');
  const emptyState= document.getElementById('emptyState');
  const viewRend  = document.getElementById('view-rendered');
  const viewJson  = document.getElementById('view-json');
  const jsonPre   = document.getElementById('jsonPre');
  const copyBtn   = document.getElementById('copyBtn');

  // ── drag & drop ──
  dropZone.addEventListener('dragover', e => {
    e.preventDefault();
    dropZone.classList.add('drag-over');
  });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    const f = e.dataTransfer.files[0];
    if (f) setFile(f);
  });
  fileInput.addEventListener('change', () => {
    if (fileInput.files[0]) setFile(fileInput.files[0]);
  });

  function setFile(f) {
    currentFile = f;
    fileName.textContent = f.name;
    fileName.style.display = 'block';
    dropZone.classList.add('has-file');
    dropZone.querySelector('.drop-main').textContent = 'Файл выбран';
    runBtn.disabled = false;
    setStatus('info', `Файл: ${f.name} (${(f.size/1024).toFixed(0)} KB)`);
  }

  // ── conf slider ──
  confRange.addEventListener('input', () => {
    confVal.textContent = parseFloat(confRange.value).toFixed(2);
  });

  // ── tabs ──
  document.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTab = btn.dataset.tab;
      document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (currentResult) renderOutput(currentResult);
    });
  });

  // ── run ──
  runBtn.addEventListener('click', async () => {
    if (!currentFile) return;

    runBtn.disabled = true;
    setStatus('wait', '<span class="spinner"></span> Обработка...');

    const fd = new FormData();
    fd.append('file', currentFile);
    fd.append('model_path', modelPath.value.trim());
    fd.append('conf', confRange.value);

    try {
      const resp = await fetch('/api/process', { method: 'POST', body: fd });
      const data = await resp.json();

      if (data.ok) {
        currentResult = data.result;
        renderOutput(data.result);
        copyBtn.style.display = 'block';
        setStatus('ok', '✓ Распознавание завершено');
      } else {
        showError(data.error, data.traceback);
        setStatus('err', `✗ Ошибка: ${data.error}`);
      }
    } catch (e) {
      showError(e.message);
      setStatus('err', `✗ Сетевая ошибка: ${e.message}`);
    } finally {
      runBtn.disabled = false;
    }
  });

  // ── clear ──
  clearBtn.addEventListener('click', () => {
    currentFile = null;
    currentResult = null;
    fileInput.value = '';
    fileName.style.display = 'none';
    dropZone.classList.remove('has-file');
    dropZone.querySelector('.drop-main').textContent = 'Перетащите изображение';
    runBtn.disabled = true;
    copyBtn.style.display = 'none';
    emptyState.style.display = 'flex';
    viewRend.style.display = 'none';
    viewJson.style.display = 'none';
    setStatus('info', 'Ожидание файла...');
  });

  // ── copy ──
  copyBtn.addEventListener('click', () => {
    const text = activeTab === 'json'
      ? JSON.stringify(currentResult, null, 2)
      : buildPlainText(currentResult);
    navigator.clipboard.writeText(text).then(() => {
      copyBtn.textContent = 'Скопировано ✓';
      setTimeout(() => copyBtn.textContent = 'Копировать', 1500);
    });
  });

  // ── render ──
  function renderOutput(data) {
    emptyState.style.display = 'none';

    if (activeTab === 'json') {
      viewRend.style.display = 'none';
      viewJson.style.display = 'block';
      jsonPre.textContent = JSON.stringify(data, null, 2);
    } else {
      viewJson.style.display = 'none';
      viewRend.style.display = 'block';
      viewRend.innerHTML = buildRenderedHTML(data);
    }
  }

  function buildRenderedHTML(data) {
    let html = '';

    if (data.title) {
      html += `<div class="result-title">${esc(data.title)}</div>`;
    }

    const meta = data.meta || {};
    if (Object.keys(meta).length > 0) {
      html += '<div class="meta-grid">';
      for (const [k, v] of Object.entries(meta)) {
        html += `<div class="meta-key">${esc(k)}</div><div class="meta-val">${esc(v)}</div>`;
      }
      html += '</div>';
    }

    for (const tbl of (data.tables || [])) {
      const header = tbl.header || [];
      const rows   = tbl.rows   || [];
      if (!header.length) continue;

      html += '<div class="tbl-wrap"><table><thead><tr>';
      for (const h of header) html += `<th>${esc(h)}</th>`;
      html += '</tr></thead><tbody>';
      for (const row of rows) {
        html += '<tr>';
        for (const h of header) html += `<td>${esc(row[h] ?? '')}</td>`;
        html += '</tr>';
      }
      html += '</tbody></table></div>';
    }

    if (!html) html = '<p style="font-family:var(--mono);font-size:12px;color:var(--dim)">Данные не извлечены</p>';
    return html;
  }

  function buildPlainText(data) {
    const lines = [];
    if (data.title) lines.push(data.title, '');
    for (const [k, v] of Object.entries(data.meta || {})) lines.push(`${k}: ${v}`);
    for (const tbl of (data.tables || [])) {
      lines.push('');
      lines.push(tbl.header.join('\t'));
      for (const row of tbl.rows) lines.push(tbl.header.map(h => row[h] ?? '').join('\t'));
    }
    return lines.join('\n');
  }

  function showError(msg, tb) {
    emptyState.style.display = 'none';
    viewJson.style.display = 'none';
    viewRend.style.display = 'block';
    viewRend.innerHTML = `
      <div style="font-family:var(--mono);font-size:12px;color:var(--red)">
        <div style="margin-bottom:12px;font-weight:600">Ошибка выполнения</div>
        <div style="color:#f87171;margin-bottom:${tb ? '16px' : '0'}">${esc(msg)}</div>
        ${tb ? `<pre style="font-size:11px;color:#666;white-space:pre-wrap">${esc(tb)}</pre>` : ''}
      </div>`;
  }

  function setStatus(type, html) {
    statusBar.className = `status-bar show ${type}`;
    statusBar.innerHTML = html;
  }

  function esc(s) {
    return String(s)
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;');
  }
</script>
</body>
</html>
